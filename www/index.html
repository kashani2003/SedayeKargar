<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شکایت کارگری</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#17302b;--mut:#5d716c;--pri:#0f6b5c;--pri2:#0a4a40;--acc:#e8a317;--line:#d3dedb;--ok:#1d8a4f;--err:#b3382c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a18;--card:#17272a;--ink:#e6f0ed;--mut:#9ab0ab;--line:#2a3f3c;--pri:#2fb59f;--pri2:#1f8a78}}
:root[data-theme="dark"]{--bg:#0f1a18;--card:#17272a;--ink:#e6f0ed;--mut:#9ab0ab;--line:#2a3f3c;--pri:#2fb59f;--pri2:#1f8a78}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding:16px 16px 90px}
h1{font-size:22px;margin:8px 0 4px;font-weight:800}
h2{font-size:17px;margin:0 0 10px}
p{margin:0 0 10px;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
textarea{min-height:100px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:600}
.btn{background:var(--pri);color:#fff;width:100%;margin-top:12px}
.btn:hover{background:var(--pri2)}
.ghost{background:transparent;color:var(--pri);border:1px solid var(--line);width:100%;margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 4px;font-size:13px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;width:100%;max-width:460px}
.nav button{flex:1;background:none;color:var(--mut);padding:12px 4px;border-radius:0;font-size:13px}
.nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#fdf0cf;color:#7a5600}
.badge.done{background:#d8f1e3;color:var(--ok)}
.badge.rej{background:#f6dcd8;color:var(--err)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tl{list-style:none;margin:12px 0 0;padding:0}
.tl li{position:relative;padding:0 26px 14px 0;color:var(--mut);font-size:14px}
.tl li:before{content:"";position:absolute;right:0;top:6px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.tl li:after{content:"";position:absolute;right:5px;top:20px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child:after{display:none}
.tl li.done{color:var(--ink)}
.tl li.done:before{background:var(--pri)}
.tl li.cur:before{background:var(--acc);box-shadow:0 0 0 4px #e8a31733}
.tl small{display:block;color:var(--mut);font-size:12px}
.sms{background:#10211e;color:#d8f5ec;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px;direction:rtl}
.sms small{display:block;opacity:.6;font-size:11px}
.note{font-size:12px;color:var(--mut);background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-top:10px}
.err{color:var(--err);font-size:13px;min-height:20px}
.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center}
.top button{background:none;color:var(--mut);font-size:13px;padding:4px}

body.lg{background:#0b1513}

body.lg .app{display:flex;flex-direction:column;justify-content:flex-start;padding:calc(var(--h) - 14px) 12px 14px;min-height:100vh;min-height:100dvh}
body.lg h1{display:none}
body.lg .lgp{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
body.lg .card{background:rgba(255,255,255,.93);color:#17302b;backdrop-filter:blur(6px)}
body.lg .card input{background:#fff;color:#17302b}
body.lg .tabs button{background:rgba(255,255,255,.85);color:#3d524d}
body.lg .tabs button.on{background:var(--pri);color:#fff}
body.lg .note{background:rgba(255,255,255,.85);color:#3d524d}
body.lg .lgp{margin:0 0 6px;font-size:13px}
body.lg .tabs{margin-bottom:6px}
body.lg .tabs button{padding:7px 4px;font-size:12px}
body.lg .card{padding:12px;margin-bottom:6px}
body.lg label{margin:4px 0 3px}
body.lg input{padding:9px}
body.lg .btn{margin-top:8px;padding:10px}
body.lg .ghost{margin-top:6px;padding:9px}
body.lg .err{min-height:0;font-size:12px}
body.lg .note{margin-top:0;font-size:11px;padding:6px 8px;line-height:1.5}
.two{display:flex;gap:8px}.two input{min-width:0}
.warn{background:#fdecea;color:var(--err);border-radius:10px;padding:8px 10px;font-size:13px;margin:10px 0 0}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px 10px;text-align:center;cursor:pointer;color:var(--mut);margin-top:10px;font-size:13px}
.drop small{display:block;margin-top:4px}
.fl{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.rm{background:none;color:var(--err);padding:2px 8px;font-size:14px}
.pt{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.guide{font-size:12px;color:var(--mut);margin:0 0 6px}
.okm{color:var(--ok);font-size:13px;margin-bottom:4px}
.fl{gap:6px}.fl .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl select{width:auto;max-width:120px;padding:4px;font-size:12px}
.fl a{text-decoration:none;color:var(--pri)}
.th{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;flex:none}
.steps{display:flex;gap:5px;margin:2px 0 8px}.st{flex:1;height:6px;border-radius:99px;background:var(--line)}.st.done{background:var(--pri)}.st.cur{background:var(--acc)}
.stt{font-size:13px;color:var(--mut);margin-bottom:10px}.stt b{color:var(--ink)}
.nav2{display:flex;gap:8px}.nav2 button{flex:1;width:auto}
.nav2{margin-top:12px}.nav2 button{margin:0;font-size:14px;padding:11px 6px}
.st.done{cursor:pointer}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv span{color:var(--mut);flex:none}.kv b{font-weight:600;text-align:start;max-width:62%;word-break:break-word}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}.chk input{width:auto}

<body>
<div class="app" id="app"></div>
<script>
const STAGES=["ثبت شد","بررسی و نوبت دهی","ارجاع به هیات تشخیص","جلسه رسیدگی","نتیجه نهایی"];
const CATS=["عدم پرداخت حقوق","اخراج غیرقانونی","بیمه و مزایا","ایمنی محل کار","ساعات کار و اضافه‌کاری","سایر"];
let S={user:null,tab:"new",view:"login",method:"otp",otpCode:null,phone:"",sms:[],complaints:[],sel:null,err:""};
try{const d=JSON.parse(localStorage.getItem("wc")||"null");if(d)S=Object.assign(S,d,{err:""})}catch(e){}
function save(){try{localStorage.setItem("wc",JSON.stringify({user:S.user,sms:S.sms,complaints:S.complaints.map(c=>c.pet?{...c,pet:c.pet.map(p=>({...p,files:p.files.map(f=>({n:f.n,t:f.t}))}))}:c),tab:S.tab,view:S.view}))}catch(e){}}
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const en=s=>String(s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const now=()=>new Date().toLocaleString("fa-IR");
function sendSms(text){S.sms.unshift({text,t:now()});save()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function login(){
 const m=S.method;
 return `<h1>صدای کارگر</h1><p class="lgp">برای ثبت و پیگیری شکایت وارد شوید.</p>
 <div class="tabs">
  <button class="${m=="otp"?"on":""}" onclick="S.method='otp';S.otpCode=null;S.err='';R()">کد پیامکی</button>
  <button class="${m=="pass"?"on":""}" onclick="S.method='pass';S.err='';R()">کد ملی و رمز</button>
  <button class="${m=="nid"?"on":""}" onclick="S.method='nid';S.err='';R()">درگاه ملی</button>
 </div><div class="card">${m=="otp"?otpForm():m=="pass"?passForm():nidForm()}<div class="err">${esc(S.err)}</div></div>
 <div class="note">نسخه نمایشی: ارسال پیامک و درگاه‌های احراز هویت شبیه‌سازی شده‌اند. در نسخه واقعی به سرور و سرویس پیامک متصل می‌شود.</div>`;
}
function otpForm(){
 if(!S.otpCode)return `<label>شماره موبایل</label><input id="ph" inputmode="tel" placeholder="۰۹۱۲۳۴۵۶۷۸۹" value="${esc(S.phone)}"><button class="btn" onclick="reqOtp()">ارسال کد تأیید</button>`;
 return `<label>کد ۵ رقمی ارسال‌شده به ${fa(S.phone)}</label><input id="otp" inputmode="numeric" maxlength="5"><button class="btn" onclick="chkOtp()">تأیید و ورود</button><button class="ghost" onclick="S.otpCode=null;R()">تغییر شماره</button>
 <div class="note">کد نمایشی شما: <b>${fa(S.otpCode)}</b></div>`;
}
function passForm(){return `<label>کد ملی</label><input id="nid" inputmode="numeric" maxlength="10"><label>رمز عبور</label><input id="pw" type="password"><button class="btn" onclick="chkPass()">ورود</button>`}
function nidForm(){return `<p>ورود از طریق حساب یکپارچه ملی (مثلاً درگاه دولت‌یار یا سرویس احراز هویت سازمانی) انجام می‌شود.</p><button class="btn" onclick="loginAs('کاربر درگاه ملی','—')">ورود با درگاه ملی</button>`}
function reqOtp(){
 const p=en(document.getElementById("ph").value.trim());
 if(!/^09\d{9}$/.test(p)){S.err="شماره موبایل معتبر نیست (مثال: ۰۹۱۲۳۴۵۶۷۸۹)";R();return}
 S.phone=p;S.otpCode=String(Math.floor(10000+Math.random()*90000));S.err="";sendSms("کد ورود شما: "+fa(S.otpCode));R();
}
function chkOtp(){
 if(en(document.getElementById("otp").value.trim())!==S.otpCode){S.err="کد وارد‌شده درست نیست";R();return}
 loginAs("کارگر",S.phone);
}
function chkPass(){
 const n=en(document.getElementById("nid").value.trim()),p=document.getElementById("pw").value;
 if(!/^\d{10}$/.test(n)||p.length<6){S.err="کد ملی ۱۰ رقمی و رمز حداقل ۶ کاراکتر لازم است";R();return}
 loginAs("کارگر",S.phone||"—");
}
function loginAs(name,phone){S.user={name,phone};S.view="home";S.err="";S.otpCode=null;save();R()}

function home(){
 const t=S.tab;
 return `<div class="top"><div><h1>سلام، ${esc(S.user.name)}</h1></div><button onclick="S.user=null;S.view='login';save();R()">خروج</button></div>`+
 (t=="new"?newForm():t=="list"?list():smsBox())+
 `<div class="nav"><div>
  <button class="${t=="new"?"on":""}" onclick="S.tab='new';S.sel=null;save();R()">شکایت جدید</button>
  <button class="${t=="list"?"on":""}" onclick="S.tab='list';S.sel=null;save();R()">پیگیری (${fa(S.complaints.length)})</button>
  <button class="${t=="sms"?"on":""}" onclick="S.tab='sms';save();R()">پیامک‌ها (${fa(S.sms.length)})</button></div></div>`;
}
const CT=["قرارداد دائم","قرارداد موقت (مدت معین)","قرارداد کار معین","قرارداد پیمانکاری","شفاهی / بدون قرارداد"];
const INS=["بیمه‌شده تأمین اجتماعی","بیمه‌نشده","بیمه ناقص (برخی ماه‌ها)"];
const PAY=["نقدی","واریز به حساب","چک","ترکیبی"];
const RT=["صنفی/کارگاهی/مغازه/سایر (حقیقی)","شرکتی (حقوقی)"];
const PV=["آذربایجان شرقی","آذربایجان غربی","اردبیل","اصفهان","البرز","ایلام","بوشهر","تهران","چهارمحال و بختیاری","خراسان جنوبی","خراسان رضوی","خراسان شمالی","خوزستان","زنجان","سمنان","سیستان و بلوچستان","فارس","قزوین","قم","کردستان","کرمان","کرمانشاه","کهگیلویه و بویراحمد","گلستان","گیلان","لرستان","مازندران","مرکزی","هرمزگان","همدان","یزد"];
const DT=["قرارداد کار","لیست حضور و غیاب","پرینت بانکی","گواهی اشتغال","برگه تسویه حساب","لایحه دفاعیه","استعلام بیمه","برگه مرخصی","استشهادیه","گزارش کلانتری","برگ ماموریت","نامه عدم نیاز","کارگزینی","فیش حقوقی","سایر","مدارک پزشکی"];
const RQ='<span style="color:var(--err)"> (الزامی)</span>';
const FK=["title","ctype","ins","base","paid","pay","wm","wd","cm","cd","rtype","emp","shenase","regno","regauth","rfn","rln","rpos","rnid","prov","city","tel","mob","email","post","addr","abProv","abCity","abPost","abAddr","abTel"];
const D0=()=>{const o={pet:[{t:"",d:"",dt:"",files:[]}]};FK.forEach(k=>o[k]="");o.abSame="1";return o};
S.draft=D0();try{const sd=JSON.parse(localStorage.getItem("wcd")||"null");if(sd)S.draft=Object.assign(D0(),sd)}catch(e){}
const V=id=>{const e=document.getElementById(id);return e?e.value:undefined};
function collect(){const d=S.draft;FK.forEach(k=>{const v=V("f_"+k);if(v!==undefined)d[k]=v});{const cb=document.getElementById("f_abSame");if(cb)d.abSame=cb.checked?"1":"0"}d.pet.forEach((p,i)=>{["t","d","dt"].forEach(k=>{const v=V("p"+i+"_"+k);if(v!==undefined)p[k]=v})})}
const inp=(k,l,r,mode)=>`<label>${l}${r?RQ:""}</label><input id="f_${k}" ${mode?`inputmode="${mode}"`:""} value="${esc(S.draft[k])}">`;
const num=(k,ph)=>`<input id="f_${k}" inputmode="numeric" placeholder="${ph}" value="${esc(S.draft[k])}">`;
const sel=(id,l,r,opts,val)=>`<label>${l}${r?RQ:""}</label><select id="${id}"><option value="">انتخاب کنید</option>${opts.map(o=>`<option ${o==val?"selected":""}>${o}</option>`).join("")}</select>`;
const STEPS=["اطلاعات شغلی","اطلاعات محل کار و شرکت","آدرس و آدرس ابلاغ","اسناد و مدارک","خلاصه اطلاعات"];
S.step=S.draft.step||0;
function stepJob(d){return `<div class="card"><h2>اطلاعات شغلی</h2>
 ${inp("title","عنوان شغلی",1)}
 ${sel("f_ctype","نوع قرارداد",1,CT,d.ctype)}
 ${sel("f_ins","وضعیت بیمه",1,INS,d.ins)}
 ${inp("base","میزان مزد پایه/مبنا/ثابت/روزانه (ریال)",1,"numeric")}
 ${inp("paid","میزان مزد دریافتی (ریال)",1,"numeric")}
 ${sel("f_pay","نحوه دریافت مزد",1,PAY,d.pay)}
 <label>میزان سابقه کار در کارگاه مورد شکایت</label><div class="two">${num("wm","ماه")}${num("wd","روز (الزامی)")}</div>
 <label>سابقه کار نزد آخرین کارفرما (مخصوص کارگران طرف قرارداد پیمانکاری)</label><div class="two">${num("cm","ماه")}${num("cd","روز")}</div></div>`}
function newForm(){const d=S.draft,n=S.step;
 const body=[stepJob,khande,stepAddr,d=>petInfo(d.pet[0],0)+petDocs(d.pet[0],0),summary][n](d);
 const nav=n==4?`<button class="ghost" onclick="S.step=0;S.err='';R();window.scrollTo(0,0)">ویرایش</button>${S.editId?`<button class="ghost" onclick="cancelEdit()">انصراف</button><button class="btn" onclick="submitC()">ذخیره تغییرات</button>`:`<button class="ghost" onclick="saveDraft()">ثبت موقت</button><button class="btn" onclick="submitC()">ثبت نهایی</button>`}`
  :`${n?`<button class="ghost" onclick="prevStep()">قبلی</button>`:""}<button class="btn" onclick="nextStep()">بعدی</button>`;
 return `${S.editId?`<div class="warn" style="background:#fdf0cf;color:#7a5600;margin:0 0 10px">در حال ویرایش شکایت کد ${fa(S.editId)}؛ تغییرات پس از «ذخیره تغییرات» اعمال می‌شود.</div>`:""}<div class="steps">${STEPS.map((t,i)=>`<div class="st ${i<n?"done":i==n?"cur":""}" ${i<n?`onclick="goStep(${i})"`:""}></div>`).join("")}</div>
 <div class="stt">مرحله ${fa(n+1)} از ${fa(5)}: <b>${STEPS[n]}</b></div>${body}
 <div class="err" id="err">${esc(S.err)}</div><div class="okm">${esc(S.msg||"")}</div>
 <div class="nav2">${nav}</div>`}
function goStep(i){if(i<S.step){collect();S.err="";S.msg="";S.step=i;R();window.scrollTo(0,0)}}
function stepAddr(d){const same=d.abSame!="0",co=d.rtype==RT[1];
 return contactCard(d)+`<div class="card"><h2>آدرس ابلاغ</h2><p class="guide">نشانی‌ای که ابلاغیه‌ها و اوراق مربوط به پرونده به خوانده ارسال می‌شود.</p>
 <label class="chk"><input type="checkbox" id="f_abSame" ${same?"checked":""} onchange="collect();R()"> آدرس ابلاغ همان آدرس ${co?"شرکت":"کارگاه"} است</label>
 ${same?"":sel("f_abProv","استان",1,PV,d.abProv)+inp("abCity","شهرستان",1)+inp("abPost","کد پستی",0,"numeric")+inp("abTel","شماره تلفن",0,"tel")+inp("abAddr","آدرس",1)}</div>`}
const kv=r=>r.filter(x=>x[1]!==""&&x[1]!=null).map(([k,v])=>`<div class="kv"><span>${k}</span><b>${esc(v)}</b></div>`).join("");
const nm=x=>{const v=Number(en(x));return x===""||isNaN(v)?"":v.toLocaleString("fa-IR")};
function summary(d){const co=d.rtype==RT[1],p=d.pet[0];
 return `<p class="guide">اطلاعات واردشده را بررسی کنید. برای اصلاح «ویرایش» را بزنید.</p>
 <div class="card"><h2>اطلاعات شغلی</h2>${kv([["عنوان شغلی",d.title],["نوع قرارداد",d.ctype],["وضعیت بیمه",d.ins],["مزد پایه (ریال)",nm(d.base)],["مزد دریافتی (ریال)",nm(d.paid)],["نحوه دریافت مزد",d.pay],["سابقه در کارگاه",fa(d.wm||0)+" ماه و "+fa(d.wd||0)+" روز"],["سابقه نزد آخرین کارفرما",d.cm||d.cd?fa(d.cm||0)+" ماه و "+fa(d.cd||0)+" روز":""]])}</div>
 <div class="card"><h2>${co?"اطلاعات شرکت":"اطلاعات محل کار"}</h2>${kv([["نوع خوانده",d.rtype],[co?"نام شرکت":"نام کارگاه",d.emp],["شناسه ملی",d.shenase],["شماره ثبت",d.regno],["مرجع ثبت",d.regauth],["مسئول شرکت",(d.rfn+" "+d.rln).trim()],["سمت",d.rpos],["شماره ملی مسئول",d.rnid]])}</div>
 <div class="card"><h2>آدرس و آدرس ابلاغ</h2>${kv([["استان",d.prov],["شهرستان",d.city],["تلفن",d.tel],["همراه",d.mob],["ایمیل",d.email],["کد پستی",d.post],["آدرس",d.addr],["آدرس ابلاغ",d.abSame=="0"?[d.abProv,d.abCity,d.abAddr].filter(Boolean).join("، ")+(d.abPost?" · کد پستی "+d.abPost:""):"همان آدرس بالا"]])}</div>
 <div class="card"><h2>دادخواست و مدارک</h2>${kv([["عنوان خواسته",p.t],["شرح خواسته",p.d],["اسناد پیوست",p.files.length?p.files.map(x=>x.n+" ("+x.t+")").join("، "):"ندارد"]])}</div>`}
function petInfo(p,i){return `<div class="card"><h2>اطلاعات دادخواست</h2>
 <label>عنوان خواسته${RQ}</label><input id="p${i}_t" value="${esc(p.t)}">
 <div class="warn"><b>تذکر:</b> لطفاً شرح خواسته خود را به شکل واضح و کامل توضیح دهید.</div>
 <label>شرح خواسته${RQ}</label><textarea id="p${i}_d">${esc(p.d)}</textarea></div>`}
function petDocs(p,i){return `<div class="card"><h2>اسناد و مدارک دادخواست</h2>
 ${sel("p"+i+"_dt","نوع سند یا مدرک",0,DT,p.dt)}
 <label class="drop"><input type="file" hidden multiple accept=".pdf,.jpg,.jpeg,.png" onchange="addFiles(${i},this)">فایل را اینجا رها کنید یا کلیک کنید<small>فرمت‌های مجاز: PDF, JPG, PNG, JPEG</small></label>
 ${p.files.length?p.files.map((x,k)=>`<div class="fl">${x.img?`<img class="th" src="${x.u}" alt="">`:`<span class="th">📄</span>`}<span class="fn">${esc(x.n)}</span><select onchange="setFT(${i},${k},this.value)">${DT.map(o=>`<option ${o==x.t?"selected":""}>${o}</option>`).join("")}</select>${x.img?`<a href="${x.u}" download="${esc(x.n)}">⬇</a>`:""}<button class="rm" onclick="rmFile(${i},${k})">🗑</button></div>`).join(""):`<p class="guide" style="margin-top:8px">هنوز فایلی اضافه نشده است.</p>`}</div>`}
const d2=i=>fa(i+1);
const toErr=()=>{const e=document.getElementById("err");if(e)e.scrollIntoView({block:"center"})};
function rmFile(i,k){collect();S.draft.pet[i].files.splice(k,1);R()}
function addFiles(i,el){collect();S.msg="";const p=S.draft.pet[i];
 if(!p.dt){S.err="ابتدا نوع سند یا مدرک را انتخاب کنید.";R();toErr();return}
 [...el.files].forEach(x=>{let u="";try{if(/^image\//.test(x.type))u=URL.createObjectURL(x)}catch(e){}p.files.push({n:x.name,t:p.dt,u,img:!!u})});S.err="";R()}
function setFT(i,k,v){collect();S.draft.pet[i].files[k].t=v;R()}
function saveDraft(){collect();const c=JSON.parse(JSON.stringify(S.draft));c.step=S.step;c.pet.forEach(p=>p.files=p.files.map(f=>({n:f.n,t:f.t})));try{localStorage.setItem("wcd",JSON.stringify(c));S.msg="ثبت موقت انجام شد؛ بعداً می‌توانید ادامه دهید.";S.err=""}catch(e){S.err="ذخیره پیش‌نویس ممکن نشد."}R()}
function inquire(){collect();const d=S.draft;if(!/^\d{11}$/.test(en(d.shenase).trim())){S.err="شناسه ملی شرکت باید ۱۱ رقم باشد.";R();toErr();return}
 d.emp=d.emp||"شرکت نمونه (نتیجه استعلام شبیه‌سازی‌شده)";d.regno=d.regno||String(100000+Math.floor(Math.random()*899999));d.regauth=d.regauth||"اداره ثبت شرکت‌ها";S.err="";R()}
function khande(d){const hq=d.rtype==RT[0],co=d.rtype==RT[1];
 let h=`<div class="card"><h2>خوانده</h2><p class="guide">راهنما: انتخاب خوانده (کسی که از او قصد شکایت دارید)</p><label>نوع خوانده${RQ}</label><select id="f_rtype" onchange="collect();R()"><option value="">انتخاب کنید</option>${RT.map(o=>`<option ${o==d.rtype?"selected":""}>${o}</option>`).join("")}</select></div>`;
 if(!hq&&!co)return h;
 h+=`<div class="card"><h2>اطلاعات محل کار</h2>`;
 if(co)h+=`<p class="guide">شناسه ملی شرکت را وارد کنید و با «استعلام» اطلاعات شرکت را بیابید.</p>${inp("shenase","شناسه ملی شرکت",1,"numeric")}<button class="ghost" style="margin:6px 0 0" onclick="inquire()">استعلام (نمونه)</button>${inp("emp","نام شرکت",1)}${inp("regno","شماره ثبت شرکت",0,"numeric")}${inp("regauth","مرجع ثبت شرکت",0)}`;
 else h+=inp("emp","نام کارگاه",1);
 h+=`</div>`;
 if(co)h+=`<div class="card"><h2>اطلاعات مسئول شرکت</h2>${inp("rfn","نام",1)}${inp("rln","نام خانوادگی",1)}${inp("rpos","سمت",0)}${inp("rnid","شماره ملی",0,"numeric")}</div>`;
 return h}
function contactCard(d){const co=d.rtype==RT[1];
 return `<div class="card"><h2>آدرس ${co?"شرکت":"کارگاه"}</h2><p class="guide">استان و شهرستان باید محل کار و محل رسیدگی به پرونده شما باشد.</p>${sel("f_prov","استان",1,PV,d.prov)}${inp("city","شهرستان",co)}${inp("tel","شماره تلفن",0,"tel")}${inp("mob","شماره همراه",0,"tel")}${inp("email","پست الکترونیک",0)}${inp("post","کد پستی",0,"numeric")}${inp("addr","آدرس",co)}</div>`}
function miss(n){collect();const d=S.draft,p=d.pet[0],m=[],ne=x=>!String(x).trim(),co=d.rtype==RT[1];
 if(n==0){[["title","عنوان شغلی"],["ctype","نوع قرارداد"],["ins","وضعیت بیمه"],["base","مزد پایه"],["paid","مزد دریافتی"],["pay","نحوه دریافت مزد"],["wd","روز سابقه کار"]].forEach(([k,l])=>{if(ne(d[k]))m.push(l)});
  ["base","paid"].forEach(k=>{if(d[k]&&!/^\d+$/.test(en(d[k]).trim()))m.push("عدد معتبر برای "+(k=="base"?"مزد پایه":"مزد دریافتی"))});
  if(d.ctype==CT[3]&&ne(d.cd))m.push("سابقه نزد آخرین کارفرما")}
 if(n==1){if(ne(d.rtype))m.push("نوع خوانده");else{if(ne(d.emp))m.push(co?"نام شرکت":"نام کارگاه");if(co){if(ne(d.shenase))m.push("شناسه ملی شرکت");else if(!/^\d{11}$/.test(en(d.shenase).trim()))m.push("شناسه ملی ۱۱ رقمی");if(ne(d.rfn))m.push("نام مسئول شرکت");if(ne(d.rln))m.push("نام خانوادگی مسئول شرکت")}}}
 if(n==2){if(ne(d.prov))m.push("استان");if(co){if(ne(d.city))m.push("شهرستان");if(ne(d.addr))m.push("آدرس")}if(d.abSame=="0"){if(ne(d.abProv))m.push("استان آدرس ابلاغ");if(ne(d.abCity))m.push("شهرستان آدرس ابلاغ");if(ne(d.abAddr))m.push("آدرس ابلاغ")}}
 if(n==3&&(ne(p.t)||p.d.trim().length<10))m.push("عنوان و شرح (حداقل ۱۰ حرف) خواسته");
 return m}
function nextStep(){const m=miss(S.step);S.msg="";if(m.length){S.err="موارد زیر را تکمیل کنید: "+m.join("، ");R();toErr();return}S.err="";S.step++;R();window.scrollTo(0,0)}
function prevStep(){collect();S.err="";S.msg="";S.step--;R();window.scrollTo(0,0)}
function submitC(){
 for(let n=0;n<4;n++){const m=miss(n);if(m.length){S.step=n;S.err="موارد زیر را تکمیل کنید: "+m.join("، ");S.msg="";R();window.scrollTo(0,0);return}}
 collect();S.msg="";const d=S.draft;
 const id="W-"+(1000+S.complaints.length*7+Math.floor(Math.random()*6));
 const {pet,step,...job}=d;
 if(S.editId){const c=S.complaints.find(x=>x.id===S.editId);if(c&&c.stage===0){Object.assign(c,{cat:pet.map(p=>p.t).join(" + "),emp:d.emp,job,pet:JSON.parse(JSON.stringify(pet)),edited:now()});sendSms(`شکایت ${fa(c.id)} ویرایش شد.`)}
  const eid=S.editId;S.draft=S.prevDraft||D0();S.prevDraft=null;S.editId=null;S.step=0;S.err="";S.tab="list";S.sel=eid;save();R();window.scrollTo(0,0);return}
 S.complaints.unshift({id,cat:pet.map(p=>p.t).join(" + "),emp:d.emp,job,pet:JSON.parse(JSON.stringify(pet)),stage:0,log:[{s:0,t:now()}]});
 sendSms(`شکایت شما با کد ${fa(id)} ثبت شد. وضعیت: ${STAGES[0]}`);
 S.draft=D0();try{localStorage.removeItem("wcd")}catch(e){}S.step=0;S.err="";S.tab="list";S.sel=id;save();R();window.scrollTo(0,0);
}
function editBlock(c){
 const t=c.edited?`<p class="guide" style="margin:6px 0 0">آخرین ویرایش: ${c.edited}</p>`:"";
 return c.stage===0?`<div class="pt"><button class="ghost" style="margin:0" onclick="editC('${c.id}')">ویرایش دادخواست</button><p class="guide" style="margin:6px 0 0">تا قبل از رفتن پرونده به مرحله «${STAGES[1]}» می‌توانید آن را ویرایش کنید.</p>${t}</div>`:`<p class="guide" style="margin-top:8px">پرونده وارد مرحله بعد شده و ویرایش آن ممکن نیست.</p>${t}`}
function editC(id){const c=S.complaints.find(x=>x.id===id);if(!c||c.stage!==0||!c.pet)return;
 if(!S.editId)S.prevDraft=S.draft;
 S.draft=Object.assign(D0(),JSON.parse(JSON.stringify(c.job)),{pet:JSON.parse(JSON.stringify(c.pet))});
 S.editId=id;S.step=0;S.err="";S.msg="";S.tab="new";S.sel=null;R();window.scrollTo(0,0)}
function cancelEdit(){const id=S.editId;S.draft=S.prevDraft||D0();S.prevDraft=null;S.editId=null;S.step=0;S.err="";S.msg="";S.tab="list";S.sel=id;R();window.scrollTo(0,0)}
function petView(c){const j=c.job,n=x=>{const v=Number(en(x));return isNaN(v)?"—":v.toLocaleString("fa-IR")};
 return `<p>${esc(j.title)} · ${esc(j.ctype)} · ${esc(j.ins)}<br>مزد پایه: ${n(j.base)} ریال · مزد دریافتی: ${n(j.paid)} ریال (${esc(j.pay)})<br>سابقه: ${fa(j.wm||0)} ماه و ${fa(j.wd||0)} روز · خوانده: ${esc(j.rtype)}${j.prov?" · استان "+esc(j.prov):""}</p>`+
 c.pet.map((p,i)=>`<div class="pt"><b>${c.pet.length>1?"دادخواست "+d2(i)+": ":"خواسته: "}${esc(p.t)}</b><p style="margin:4px 0 0">${esc(p.d)}</p>${p.files.length?`<small>${fa(p.files.length)} فایل پیوست</small>`:""}</div>`).join("")+editBlock(c)}
function list(){
 if(S.sel){const c=S.complaints.find(x=>x.id===S.sel);if(c)return detail(c)}
 if(!S.complaints.length)return `<div class="card"><p>هنوز شکایتی ثبت نکرده‌اید.</p><button class="btn" onclick="S.tab='new';R()">ثبت اولین شکایت</button></div>`;
 return `<button class="btn" style="margin:0 0 12px" onclick="S.tab='new';R()">+ ثبت شکایت جدید</button>`+S.complaints.map(c=>`<div class="card" onclick="S.sel='${c.id}';R()" style="cursor:pointer"><div class="row"><b>${esc(c.cat)}</b><span class="badge ${c.stage==4?"done":""}">${STAGES[c.stage]}</span></div><p style="margin:6px 0 0">${esc(c.emp)} · کد ${fa(c.id)}</p></div>`).join("");
}
function detail(c){
 return `<button class="ghost" style="margin:0 0 10px" onclick="S.sel=null;R()">بازگشت به فهرست</button>
 <div class="card"><div class="row"><h2 style="margin:0">${esc(c.cat)}</h2><span class="badge ${c.stage==4?"done":""}">${STAGES[c.stage]}</span></div>
 <p>${esc(c.emp)} · کد ${fa(c.id)}</p>${c.pet?petView(c):`<p>${esc(c.desc)}</p>`}
 <ul class="tl">${STAGES.map((s,i)=>{const l=c.log.find(x=>x.s===i);return `<li class="${i<c.stage?"done":i==c.stage?"done cur":""}">${s}${l?`<small>${l.t}</small>`:""}</li>`}).join("")}</ul>
 ${c.stage<4?`<div class="note">برای آزمایش: نقش کارشناس را شبیه‌سازی کنید تا پیامک مرحله بعد ارسال شود.<button class="ghost" onclick="advance('${c.id}')">پیشبرد به مرحله بعد (کارشناس)</button></div>`:""}</div>`;
}
function advance(id){
 const c=S.complaints.find(x=>x.id===id);if(!c||c.stage>=4)return;
 c.stage++;c.log.push({s:c.stage,t:now()});
 sendSms(`پرونده ${fa(c.id)}: وضعیت شما به «${STAGES[c.stage]}» تغییر کرد.`);R();
}
function smsBox(){
 return `<div class="card"><h2>صندوق پیامک (شبیه‌سازی)</h2>${S.sms.length?S.sms.map(m=>`<div class="sms">${esc(m.text)}<small>${m.t}</small></div>`).join(""):"<p>پیامکی ارسال نشده است.</p>"}</div>`;
